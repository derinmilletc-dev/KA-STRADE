name: Tmp scope tests (temporary, delete after run)

# Geçici: yalnızca backend/tests/test_route_policy_inventory.py dosyasını çalıştırır. Sır yok, deploy yok, ağ gerektiren test yok.
on:
  push:
    branches: ['fix/auth-email-gmail-timeout']

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest inventory + moderator
        working-directory: backend
        run: python -m pytest tests/test_v22_commercial.py -v -rfE --tb=short -p no:cacheprovider --junitxml=scope-report.xml || true
      - name: Report as annotations
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          def esc(s): return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          root = ET.parse('scope-report.xml').getroot()
          rows, fails = [], []
          for case in root.iter('testcase'):
              name = case.get('name')
              bad = case.find('failure') if case.find('failure') is not None else case.find('error')
              skip = case.find('skipped')
              if bad is not None:
                  rows.append('FAIL  ' + name); fails.append(name + ' :: ' + (bad.get('message') or '')[:700])
              elif skip is not None:
                  rows.append('SKIP  ' + name)
              else:
                  rows.append('PASS  ' + name)
          counts = {k: sum(1 for r in rows if r.startswith(k)) for k in ('PASS', 'FAIL', 'SKIP')}
          print('::notice title=SCOPE RESULTS ' + str(counts) + '::' + esc('\n'.join(rows)))
          if fails:
              print('::notice title=SCOPE FAILURE DETAILS::' + esc('\n\n'.join(fails)))
          PY
