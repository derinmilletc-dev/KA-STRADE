name: Backend Assistant Tests

# Kais asistan backend testleri, gerçek bağımlılıklarla. Salt okunur: sır yok, deploy yok.
# main'de bilinen eski hatalar backend/tests/assistant_known_failures.txt'te; listede OLMAYAN her hata CI'ı kırar.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-assistant-tests.yml'
      - '.github/scripts/assistant_test_gate.py'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-assistant-tests.yml'
      - '.github/scripts/assistant_test_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout depodaki bozuk 'tradbt458-main' alt modül girdisi (.gitmodules yok) yüzünden çöküyor;
      # alt modüllere dokunmayan düz git fetch kullanılır. Jeton yalnız bu adımda, diske yazılmadan kullanılır.
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest tests/test_assistant_*.py
        working-directory: backend
        run: python -m pytest tests/test_assistant_*.py -q -rfE --tb=short -p no:cacheprovider --junitxml=assistant-report.xml || true
      - name: Gate (new failures only)
        run: python .github/scripts/assistant_test_gate.py backend/assistant-report.xml backend/tests/assistant_known_failures.txt
