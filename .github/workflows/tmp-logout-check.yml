name: Tmp logout check (temporary, delete before merge)
on:
  push:
    branches: [fix/cikis-botu-durdurmasin]
permissions:
  contents: read
jobs:
  tmp-logout-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: |
          python -m pytest tests/test_v25_live_guard.py tests/test_google_oauth.py tests/test_account_settings.py tests/test_v22_commercial.py -q -rfE --tb=short -p no:cacheprovider
