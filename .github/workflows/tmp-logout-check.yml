name: Tmp logout check (temporary, delete before merge)
on:
  push:
    branches: [fix/cikis-botu-durdurmasin]
permissions:
  contents: read
jobs:
  tmp-logout-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest (PR) + pytest (main)
        working-directory: backend
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          T="tests/test_v25_live_guard.py tests/test_google_oauth.py tests/test_account_settings.py tests/test_v22_commercial.py"
          python -m pytest $T -q -rfE --tb=line -p no:cacheprovider > /tmp/pr.txt 2>&1; PR=$?
          cd .. && git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" fetch -q --depth=1 "https://github.com/$REPO" main && git checkout -q FETCH_HEAD && cd backend
          python -m pytest $T -q -rfE --tb=line -p no:cacheprovider > /tmp/main.txt 2>&1
          grep -E "^(FAILED|ERROR)" /tmp/pr.txt | sort > /tmp/prf.txt; grep -E "^(FAILED|ERROR)" /tmp/main.txt | sort > /tmp/mainf.txt
          echo "::warning::PR summary: $(tail -1 /tmp/pr.txt)"
          echo "::warning::MAIN summary: $(tail -1 /tmp/main.txt)"
          comm -23 /tmp/prf.txt /tmp/mainf.txt | head -20 | while read -r l; do echo "::error::NEW ${l:0:900}"; done
          comm -13 /tmp/prf.txt /tmp/mainf.txt | head -10 | while read -r l; do echo "::notice::FIXED ${l:0:300}"; done
          comm -12 /tmp/prf.txt /tmp/mainf.txt | head -10 | while read -r l; do echo "::notice::BOTH ${l:0:300}"; done
          test -z "$(comm -23 /tmp/prf.txt /tmp/mainf.txt)"
