name: Backend App Tests

# Backend test paketinin büyük çoğunluğu daha önce hiçbir kontrolde çalışmıyordu (yalnız hesap silme/oturum ve canlı saat testleri çalışıyordu).
# Liste: .github/backend-tests.txt (hepsi yeşil). Her dosya AYRI süreçte çalışır (testler arası durum sızıntısı olmasın), 4 parçaya bölünür.
# Kırık dosyalar: .github/backend-tests-known-failing.txt. Sır yok, deploy yok.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/backend-tests.txt'
      - '.github/workflows/backend-app-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/backend-tests.txt'
      - '.github/workflows/backend-app-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # actions/checkout depodaki bozuk 'tradbt458-main' alt modül girdisi yüzünden çöküyor; alt modüllere dokunmayan düz git fetch kullanılır.
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest (her dosya ayrı süreç)
        working-directory: backend
        shell: bash
        run: |
          set +e
          failed=""; total=0
          mapfile -t files < <(grep -v '^#' ../.github/backend-tests.txt | grep -v '^$' | awk -v s=${{ matrix.shard }} 'NR % 4 == s')
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then failed="$failed $file(dosya yok)"; echo "::error::$file listede ama yok"; continue; fi
            total=$((total+1))
            timeout 300 python -m pytest "$file" -q -rfE --tb=short -p no:cacheprovider > pytest-out.txt 2>&1
            code=$?
            if [ $code -ne 0 ]; then
              failed="$failed $file"
              grep -E "^(FAILED|ERROR)" pytest-out.txt | head -5 | cut -c1-400 | sed "s|^|::error file=backend/$file::|"
              [ $code -eq 124 ] && echo "::error file=backend/$file::300 saniyede bitmedi"
            fi
          done
          echo "Çalıştırılan dosya: $total"
          test -z "$failed" || { echo "Başarısız:$failed"; exit 1; }
