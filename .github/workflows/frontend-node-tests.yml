name: Frontend Node Tests

# Tarayıcısız mantık ve sözleşme testleri (tools/*.test.mjs, frontend/src/*.test.mts). Sır yok, deploy yok.
# Daha önce bu testlerin çoğu hiçbir kontrolde çalışmıyordu. Aşağıdaki liste geçen testlerdir; yeni test dosyası eklenince buraya da eklenmeli.
# Bilinen kırık (listede YOK, sebepleri PR açıklamasında): grid, site-brand, master-trade-data-error, moderator-panel, hygiene-labels.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-node-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: node --test (her dosya ayrı)
        shell: bash
        run: |
          set +e
          failed=""
          for file in tools/account-risk-sizing.test.mjs tools/assistant-voice.test.mjs tools/browser-request.test.mjs tools/browser-session.test.mjs tools/campaigns.test.mjs tools/coin-logos.test.mjs tools/customer-events.test.mjs tools/demo-api-fixtures.test.mjs tools/demo-request.test.mjs tools/demo-status-guard.test.mjs tools/eslint-private-fields.test.mjs tools/exchange-connection-errors.test.mjs tools/i18n-demo.test.mjs tools/kais-agent-intents.test.mjs tools/kais-chat-storage.test.mjs tools/kais-eye-motion.test.mjs tools/kais-ui-contracts.test.mjs tools/kais-wake.test.mjs tools/legacy-observer-error-reset.test.mjs tools/live-guide.test.mjs tools/master-market-data.test.mjs tools/master-trade-fullscreen.test.mjs tools/master-trade-presentation.test.mjs tools/master-trade-request.test.mjs tools/moderator-approvals.test.mjs tools/moderator-routing.test.mjs tools/moderator-support.test.mjs tools/notification-summary.test.mjs tools/order-protection.test.mjs tools/password-policy.test.mjs tools/site-icons.test.mjs tools/site-tour.test.mjs tools/smart-trade-plans.test.mjs tools/update-check.test.mjs tools/user-critical-notifications.test.mjs tools/user-scroll.test.mjs tools/visible-interval.test.mjs tools/vite-asset-policy.test.mjs frontend/src/coin-ranking.test.mts frontend/src/manual-order-state.test.mts ; do
            node --test "$file" > node-test-out.txt 2>&1
            if [ $? -ne 0 ]; then
              failed="$failed $file"
              grep -E "^not ok|AssertionError|Error:" node-test-out.txt | head -8 | sed "s|^|::error file=$file::|"
            fi
          done
          test -z "$failed" || { echo "Başarısız:$failed"; exit 1; }
