name: Tmp scope tests (temporary, removed before PR)

on:
  push:
    branches: ['fix/operations-readiness-owner']

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/test_operations_readiness_scope.py tests/test_moderator_access.py tests/test_moderator_role.py tests/test_v22_commercial.py tests/test_v27_cloud_ops.py -q -rfE --tb=short -p no:cacheprovider --junitxml=scope-report.xml || true
      - name: Report as annotations
        working-directory: backend
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          def esc(s): return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          root = ET.parse('scope-report.xml').getroot()
          total = passed = 0; bad = []; scope = []
          for case in root.iter('testcase'):
              total += 1
              name = case.get('classname','').split('.')[-1] + '::' + case.get('name')
              fail = case.find('failure') if case.find('failure') is not None else case.find('error')
              if fail is not None:
                  bad.append(name + ' :: ' + (fail.get('message') or '')[:600])
              elif case.find('skipped') is None:
                  passed += 1
              if 'test_operations_readiness_scope' in case.get('classname',''):
                  scope.append(('FAIL ' if fail is not None else 'PASS ') + case.get('name'))
          print('::notice title=TOTAL::' + esc(f'{total} tests, {passed} passed, {len(bad)} failed'))
          print('::notice title=SCOPE FILE::' + esc('\n'.join(scope)))
          if bad:
              print('::notice title=FAILURES::' + esc('\n\n'.join(bad)))
          PY
