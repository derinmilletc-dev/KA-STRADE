name: Tmp voice holo e2e (temporary, delete after run)

on:
  push:
    branches: ['fix/voice-holo-visibility']

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund 2>&1 | tail -3
      - name: Frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund 2>&1 | tail -3
      - name: Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium 2>&1 | tail -3
      - name: Voice holo spec
        working-directory: frontend
        run: npx playwright test tests/assistant-voice-holo.spec.ts --project=chromium --reporter=list > ../voice.log 2>&1; echo "rc=$?" >> ../voice.log; tail -80 ../voice.log
      - name: Neighbouring assistant specs (regression)
        working-directory: frontend
        run: npx playwright test tests/assistant-chat.spec.ts tests/kais-eye.spec.ts tests/kais-greeting.spec.ts --project=chromium --reporter=list > ../neighbours.log 2>&1; echo "rc=$?" >> ../neighbours.log; tail -40 ../neighbours.log
      - name: Report as annotations
        if: always()
        run: |
          python3 - <<'PY'
          def esc(s): return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          def tail(path, n):
              try: return ''.join(open(path, errors='replace').readlines()[-n:])
              except OSError: return '(missing)'
          print('::notice title=VOICE HOLO::' + esc(tail('voice.log', 70)))
          print('::notice title=NEIGHBOURS::' + esc(tail('neighbours.log', 30)))
          PY
