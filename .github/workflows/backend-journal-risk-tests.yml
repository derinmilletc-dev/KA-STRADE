name: Backend Journal + Risk Gate Tests (base vs PR head)

# test_signal_journal ve test_v25_risk_gate_repairs testlerini GERÇEK bağımlılıklarla, pytest altında, AYNI ortamda iki kod
# ağacı üzerinde çalıştırır: PR'ın gerçek head SHA'sı ve hedef dalın ÇALIŞMA ANINDAKİ güncel ucu. Sonuçlar test bazında
# karşılaştırılır; hatalar ortam/kurulum, PR kaynaklı ve mevcut hata olarak ayrılır. Salt okunur: sır yok, deploy yok.
# Elle çalıştırma: head_sha / base_sha / base_ref girdileri isteğe bağlıdır (boşsa: bu iş akışının SHA'sı ve varsayılan dal ucu).
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-journal-risk-tests.yml'
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Karşılaştırılacak kod ağacı (tam 40 karakter SHA). Boşsa github.sha.'
        required: false
        default: ''
      base_sha:
        description: 'Temel kod ağacı (tam SHA). Boşsa base_ref dalının güncel ucu.'
        required: false
        default: ''
      base_ref:
        description: 'Temel dal adı (base_sha boşsa). Boşsa varsayılan dal.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # test_signal_journal bir temel commit'in analysis.py dosyasını `git show` ile okur; sığ çekimde yoktur. Tam SHA ile çekilir.
  BASELINE_SHA: 9dd89b4919b48e31109b2a46a590849e946806b2

jobs:
  journal-risk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # actions/checkout depodaki bozuk alt modül girdisi yüzünden kullanılmaz (diğer iş akışlarıyla aynı yöntem).
      - name: Resolve head and base SHAs dynamically, then fetch (no submodules)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git init -q .
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          remote() { git -c http.extraheader="$HEADER" "$@"; }
          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEAD_SHA="$PR_HEAD_SHA"; BASE_REF="$PR_BASE_REF"; BASE_SHA=""
          else
            HEAD_SHA="${INPUT_HEAD_SHA:-$WORKFLOW_SHA}"; BASE_REF="${INPUT_BASE_REF:-$DEFAULT_BRANCH}"; BASE_SHA="$INPUT_BASE_SHA"
          fi
          # Girdi doğrulaması: yalnız tam SHA ve güvenli dal adı kabul edilir.
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head SHA geçersiz"; exit 1; }
          [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::base dal adı geçersiz"; exit 1; }
          if [ -z "$BASE_SHA" ]; then
            # Olay yükündeki base.sha bayat olabilir: hedef dalın ŞU ANKİ ucu uzaktan okunur.
            BASE_SHA="$(remote ls-remote "https://github.com/$REPO" "refs/heads/$BASE_REF" | cut -f1)"
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base SHA çözülemedi ($BASE_REF)"; exit 1; }
          for sha in "$HEAD_SHA" "$BASE_SHA" "$BASELINE_SHA"; do
            remote fetch -q --depth=1 "https://github.com/$REPO" "$sha"
          done
          git worktree add -q --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          git worktree add -q --detach "$RUNNER_TEMP/head" "$HEAD_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git -C "$RUNNER_TEMP/head" show "${BASELINE_SHA:0:7}:backend/app/analysis.py" > /dev/null
          {
            echo "HEAD_SHA=$HEAD_SHA"; echo "BASE_SHA=$BASE_SHA"; echo "BASE_REF=$BASE_REF"
          } >> "$GITHUB_ENV"
          DIFFERING="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l)"
          echo "base ($BASE_REF) = $BASE_SHA"; echo "head = $HEAD_SHA"; echo "files differing = $DIFFERING"
          echo "::notice title=resolved trees::base($BASE_REF)=$BASE_SHA head=$HEAD_SHA files-differing=$DIFFERING baseline-object=$(git cat-file -t "$BASELINE_SHA") event=$EVENT_NAME"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install (union of both trees' requirements; one environment for both)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/base/backend"
          pip install -r requirements-dev.txt -r "$RUNNER_TEMP/head/backend/requirements-dev.txt"
      - name: Real dependency versions (evidence)
        run: |
          VERSIONS="$(pip list 2>/dev/null | grep -iE '^(httpx|fastapi|pytest|starlette|pydantic|pydantic-settings|asyncpg|stripe|websockets|google-api-python-client|google-auth|cryptography) ' | sort)"
          echo "$VERSIONS"
          # Günlüklere erişim kısıtlı olabilir: kanıt bildirim olarak da yazılır.
          echo "::notice title=real dependency versions::$(printf '%s' "$VERSIONS" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}') python=$(python --version 2>&1)"
      - name: pytest on base, then on PR head (results are collected, not hidden)
        shell: bash
        run: |
          set +e
          for target in base head; do
            cd "$RUNNER_TEMP/$target/backend" || exit 1
            python -m pytest tests/test_signal_journal.py tests/test_v25_risk_gate_repairs.py \
              -q -rfE --tb=short -p no:cacheprovider -o junit_family=xunit2 \
              --junitxml="$RUNNER_TEMP/$target.xml" > "$RUNNER_TEMP/$target.txt" 2>&1
            echo "$?" > "$RUNNER_TEMP/$target.rc"
            echo "== $target: pytest exit code $(cat "$RUNNER_TEMP/$target.rc")"
            tail -n 12 "$RUNNER_TEMP/$target.txt"
          done
          exit 0
      - name: Compare per test and classify failures
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys, xml.etree.ElementTree as ET
          tmp = os.environ["RUNNER_TEMP"]
          base_label = f"base {os.environ['BASE_REF']}@{os.environ['BASE_SHA'][:7]}"
          head_label = f"PR head@{os.environ['HEAD_SHA'][:7]}"
          ENV = re.compile(r"ModuleNotFoundError|No module named|ImportError|ConnectionError|name resolution|"
                           r"returned non-zero exit status 128|fatal: (invalid object|bad object|not a git)|could not read")

          def load(name):
              path = f"{tmp}/{name}.xml"
              if not os.path.exists(path):
                  return None
              rows, totals = {}, {"tests": 0, "pass": 0, "fail": 0, "skip": 0}
              for case in ET.parse(path).getroot().iter("testcase"):
                  key = f"{case.get('classname')}::{case.get('name')}"
                  bad = case.find("failure") if case.find("failure") is not None else case.find("error")
                  if bad is not None:
                      state, text = "fail", (bad.get("message") or "") + " " + (bad.text or "")
                  elif case.find("skipped") is not None:
                      state, text = "skip", case.find("skipped").get("message") or ""
                  else:
                      state, text = "pass", ""
                  rows[key] = (state, " ".join(text.split()))
                  totals["tests"] += 1
                  totals[state] += 1
              return rows, totals

          base, head = load("base"), load("head")
          out, buckets = [], {"ortam/kurulum": [], "PR kaynaklı": [], "mevcut hata (base'de de var)": [],
                              "base'de hata, PR'da yok": [], "yalnız bir sürümde var": []}
          for label, data in ((base_label, base), (head_label, head)):
              if data is None:
                  out.append(f"{label}: pytest sonuç dosyası YOK (ortam/kurulum hatası)")
                  buckets["ortam/kurulum"].append((label, "pytest sonuç üretmedi", ""))
              else:
                  t = data[1]
                  out.append(f"{label}: {t['tests']} test | geçti {t['pass']} | başarısız/hata {t['fail']} | atlandı {t['skip']}")
          if base and head:
              if base[1]["tests"] == 0 or head[1]["tests"] == 0:
                  buckets["ortam/kurulum"].append(("test toplanamadı", "0 test çalıştı", ""))
              for key in sorted(set(base[0]) | set(head[0])):
                  m, p = base[0].get(key), head[0].get(key)
                  if m is None or p is None:
                      buckets["yalnız bir sürümde var"].append((key, "base" if m else "PR head", ""))
                      continue
                  texts = " ".join(x[1] for x in (m, p) if x[0] == "fail")
                  if ENV.search(texts):
                      buckets["ortam/kurulum"].append((key, texts[:160], ""))
                  elif m[0] == "fail" and p[0] == "fail":
                      buckets["mevcut hata (base'de de var)"].append((key, p[1][:160], ""))
                  elif p[0] == "fail":
                      buckets["PR kaynaklı"].append((key, p[1][:160], ""))
                  elif m[0] == "fail":
                      buckets["base'de hata, PR'da yok"].append((key, m[1][:160], ""))
          for name, items in buckets.items():
              out.append(f"## {name}: {len(items)}")
              out.extend(f"  - {a} :: {b}" for a, b, _ in items[:25])
          # Atlanan testler dürüstçe belirtilir (geçti sayılmaz).
          for label, data in ((base_label, base), (head_label, head)):
              if data:
                  for key, (state, text) in sorted(data[0].items()):
                      if state == "skip":
                          out.append(f"ATLANDI ({label}): {key} :: {text[:100]}")
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("### base vs PR head (gerçek bağımlılıklar, pytest)\n```\n" + text + "\n```\n")
          # Günlük erişimi kısıtlı olabilir: sonuç bildirim olarak da yazılır (<=3500 karakterlik parçalar).
          chunk, parts = "", []
          for line in out:
              if len(chunk) + len(line) + 1 > 3300:
                  parts.append(chunk); chunk = ""
              chunk += line + "\n"
          parts.append(chunk)
          for number, part in enumerate(parts[:8], 1):
              print("::notice title=base vs PR head part %d::%s" % (number, part.replace("%", "%25").replace("\r", "").replace("\n", "%0A")))
          for target in ("base", "head"):
              try:
                  tail = open(f"{tmp}/{target}.txt", encoding="utf-8", errors="replace").read().splitlines()[-12:]
                  print("::notice title=pytest tail %s::%s" % (target, "\n".join(tail).replace("%", "%25").replace("\n", "%0A")[:3500]))
              except OSError:
                  pass
          blocking = buckets["ortam/kurulum"] or buckets["PR kaynaklı"]
          if buckets["mevcut hata (base'de de var)"]:
              print("::warning::base'de de bulunan mevcut hatalar var (PR kaynaklı değil); ayrıntı özette.")
          sys.exit(1 if blocking else 0)
          PY
