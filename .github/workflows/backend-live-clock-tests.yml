name: Backend Live Clock Tests

# Canlı hesap okuması: saat eşitleme, piyasa verisi kuyruğu ve Binance engeli testleri. Salt okunur: sır yok, deploy yok.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-live-clock-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-live-clock-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-clock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout depodaki bozuk 'tradbt458-main' alt modül girdisi (.gitmodules yok) yüzünden çöküyor;
      # alt modüllere dokunmayan düz git fetch kullanılır. Jeton yalnız bu adımda, diske yazılmadan kullanılır.
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest (saat eşitleme + piyasa verisi kuyruğu)
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_live_clock_reuse.py tests/test_binance_queued_clock.py tests/test_public_market_data.py tests/test_binance_rate_limit.py tests/test_exchange_connections_server_time.py -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee pytest-out.txt
          status=${PIPESTATUS[0]}
          # Hatalar iş özetinde görünsün diye bildirime de yazılır.
          grep -E "^(FAILED|ERROR) |^E  |^/.*:[0-9]+: " pytest-out.txt | head -40 | sed 's/^/::error::/'
          exit $status
