name: Backend Live Clock Tests

# Canlı hesap okuması: saat eşitleme, piyasa verisi kuyruğu ve Binance engeli testleri. Salt okunur: sır yok, deploy yok.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-live-clock-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-live-clock-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-clock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout depodaki bozuk 'tradbt458-main' alt modül girdisi (.gitmodules yok) yüzünden çöküyor;
      # alt modüllere dokunmayan düz git fetch kullanılır. Jeton yalnız bu adımda, diske yazılmadan kullanılır.
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest (saat eşitleme, piyasa verisi kuyruğu, Original V2 canlı, bildirim)
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_live_clock_reuse.py tests/test_binance_queued_clock.py tests/test_public_market_data.py tests/test_binance_rate_limit.py tests/test_exchange_connections_server_time.py tests/test_web_push.py tests/test_background_auth_recent.py tests/test_reconciliation_accounted.py tests/test_original_resume_transient.py tests/test_emergency_clear_auto_reconcile.py tests/test_manual_breakeven.py tests/test_manual_fill_audit.py tests/test_manual_grid.py tests/test_market_universe.py tests/test_protected_market_lane.py tests/test_binance_kline_stream.py tests/test_scan_rejections.py tests/test_binance_ticker_stream.py "tests/test_original_v2_live.py::test_original_session_warning_is_once_and_expiry_keeps_positions_and_latches" "tests/test_original_v2_live.py::test_original_live_execution_policy_changes_only_the_daily_symbol_scope" "tests/test_original_v2_live.py::test_original_live_unlimited_daily_trades_gate_passes_but_other_locks_remain" "tests/test_original_v2_live.py::test_original_live_consecutive_loss_limit_disabled_but_daily_loss_lock_remains" "tests/test_original_v2_live.py::test_original_live_trade_loss_budget_is_wallet_times_selected_percent" "tests/test_original_v2_live.py::test_original_live_caps_follow_the_balance_not_fixed_usdt_values" "tests/test_original_v2_live.py::test_original_live_system_ceilings_are_named_and_clip_visibly_not_silently" "tests/test_original_v2_live.py::test_original_live_screen_limits_show_the_clipped_values_so_the_ceiling_is_visible" "tests/test_original_v2_live.py::test_original_live_margin_percentages_are_configurable_with_unchanged_defaults" "tests/test_original_live_risk.py::test_daily_loss_budget_blocks_a_new_position_when_realized_loss_leaves_no_room" "tests/test_original_live_risk.py::test_daily_loss_budget_counts_open_stop_risk_of_existing_positions" "tests/test_original_live_risk.py::test_daily_loss_budget_allows_entry_with_room_and_reports_the_same_risk_as_the_stop" "tests/test_original_v2_live.py::test_original_live_daily_limit_uses_the_day_opening_balance" "tests/test_original_v2_live.py::test_original_live_open_position_totals_include_every_source_but_not_closed_plans" "tests/test_original_v2_live.py::test_original_live_risk_limits_for_the_screen_are_dynamic_and_hidden_without_balance" "tests/test_original_v2_live.py::test_original_live_open_risk_after_tp1_uses_remaining_quantity_and_current_stop" "tests/test_original_v2_live.py::test_original_live_open_risk_after_tp1_keeps_legacy_sixty_forty_split" "tests/test_original_v2_live.py::test_original_live_open_risk_is_full_until_tp1_is_verified" "tests/test_original_v2_live.py::test_original_live_open_risk_follows_stop_changes_and_never_goes_negative" "tests/test_original_v2_live.py::test_original_live_open_risk_never_underestimates_with_bad_data_or_larger_live_position" -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee pytest-out.txt
          status=${PIPESTATUS[0]}
          # Original risk kaydı (save_choice) birim testleri; aynı dosyadaki uç nokta testleri ana dalda da bozuk (v22_commercial fikstürü).
          python -m pytest tests/test_original_live_risk.py -q -rfE --tb=line -p no:cacheprovider \
            -k "boundaries or invalid_or_unconfirmed or projection or initial_default or commit_together or failed_atomic or unverified_balance or stale_revision or no_change or legacy or invalid_daily or durable_database or tightening or new_key" 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Original V2 canlı çıkış politikası (TP1 %80 seviyesi, %70 kapanış, eski planlar %60): yeni ve ilgili mevcut testler.
          python -m pytest tests/test_original_v2_live.py -q -rfE --tb=line -p no:cacheprovider \
            -k "scaled_tp1 or tp1_is_scaled or build_spec_uses_scaled or new_original_plan_installs or old_original_plan_without or invalid_plan_fraction or seventy_percent or live_sizing_context or exact_tp60 or native_sizing_with_costs or changed_original_targets or protection_identity_survives or partial_entry_tp60 or tp1_not_reallocated or cannot_split" 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          python -m pytest tests/test_original_v2_demo_execution.py -q -rfE --tb=line -p no:cacheprovider \
            -k "protection_60 or entry_requires_total or live_minimum_sizing" 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Original V2 stop kurulamazsa: 90 sn arayla 3 yeniden deneme, sonra reduce-only kapatma (yeni testler).
          python -m pytest tests/test_original_v2_live.py -q -rfE --tb=line -p no:cacheprovider \
            -k "original_stop_repair" 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Dürüst risk ayrımı: hedef / uygulanabilir maksimum / gerçekleşecek (yalnız bilgi; boyutlandırma değişmez).
          python -m pytest tests/test_original_risk_capacity.py -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Akıllı Kâr Koruma (sahte borsa; gerçek emir yok): sayaç, net kâr, geçici stop, kapatma ve güvenlik senaryoları.
          python -m pytest tests/test_original_profit_guard.py -q -rfE --tb=short -p no:cacheprovider 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          python -m pytest tests/test_original_live_risk.py -q -rfE --tb=line -p no:cacheprovider \
            -k "honest_breakdown or breakdown_is_information_only or breakdown_failure_never or unreachable_selection or expose_cost_assumption or do_not_use_the_live_breakdown or effective_trade_risk_reports" 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Teminat modları (Güvenli %30 / Orta %50 / Agresif %65): hesap bazlı, onaylı; Güvenli = bugünkü davranış.
          python -m pytest tests/test_original_margin_modes.py -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Oturumu uzat: yalnız bitiş ileri alınır; izin sınırı, geri alma ve sahiplik.
          python -m pytest tests/test_original_session_extend.py -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Gölge kayıt: yalnız gözlem; canlı emir mantığına dokunmaz, hata canlı akışı etkilemez.
          python -m pytest tests/test_original_shadow.py -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee -a pytest-out.txt
          [ ${PIPESTATUS[0]} -eq 0 ] || status=1
          # Hatalar iş özetinde görünsün diye bildirime de yazılır.
          grep -E "^(FAILED|ERROR) |^E  |^/.*:[0-9]+: " pytest-out.txt | head -40 | sed 's/^/::error::/'
          exit $status
