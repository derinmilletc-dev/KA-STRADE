name: TMP Manual Order Compare

# GEÇİCİ: birleştirmeden önce silinecek. Tüm backend testlerini main ve bu dal üzerinde koşar,
# yalnız bu dalda YENİ kırılan testleri hata olarak raporlar. Sır yok, deploy yok.
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-manual-order-compare.yml'
      - 'backend/**'
      - 'frontend/**'
      - '*.tsx'
      - '*.css'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA" main
          git -c advice.detachedHead=false checkout -q "$SHA"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Branch suite
        working-directory: backend
        shell: bash
        run: |
          set +e
          timeout 1200 python -m pytest tests -q -p no:cacheprovider -rfE --tb=no -o addopts="" --continue-on-collection-errors \
            --ignore=tests/real_acceptance_validation.py 2>&1 | tail -n 400 > /tmp/branch.txt
          grep -E "^(FAILED|ERROR) " /tmp/branch.txt | sed -E 's/ - .*//' | sort -u > /tmp/branch_fail.txt
          tail -n 1 /tmp/branch.txt > /tmp/branch_summary.txt
          true
      - name: Main suite (same tests dir from main)
        shell: bash
        run: |
          set +e
          git worktree add -q /tmp/mainwt origin/main
          cd /tmp/mainwt/backend
          timeout 1200 python -m pytest tests -q -p no:cacheprovider -rfE --tb=no -o addopts="" --continue-on-collection-errors \
            --ignore=tests/real_acceptance_validation.py 2>&1 | tail -n 400 > /tmp/main.txt
          grep -E "^(FAILED|ERROR) " /tmp/main.txt | sed -E 's/ - .*//' | sort -u > /tmp/main_fail.txt
          tail -n 1 /tmp/main.txt > /tmp/main_summary.txt
          true
      - name: Compare
        shell: bash
        run: |
          echo "::notice title=main summary::$(cat /tmp/main_summary.txt)"
          echo "::notice title=branch summary::$(cat /tmp/branch_summary.txt)"
          comm -13 /tmp/main_fail.txt /tmp/branch_fail.txt > /tmp/new_fail.txt
          comm -23 /tmp/main_fail.txt /tmp/branch_fail.txt > /tmp/fixed.txt
          echo "::notice title=counts::main_fail=$(wc -l < /tmp/main_fail.txt) branch_fail=$(wc -l < /tmp/branch_fail.txt) new=$(wc -l < /tmp/new_fail.txt) fixed=$(wc -l < /tmp/fixed.txt)"
          while read -r line; do echo "::error title=NEW FAILURE::$line"; done < /tmp/new_fail.txt
          while read -r line; do echo "::notice title=only on main::$line"; done < <(head -n 20 /tmp/fixed.txt)
          test ! -s /tmp/new_fail.txt

  e2e-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Branch e2e
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund >/dev/null && (cd frontend && npm ci --no-audit --no-fund >/dev/null && npx playwright install --with-deps chromium >/dev/null)
          npm run build >/dev/null 2>&1; echo "build exit $?"
          (cd frontend && PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/branch-e2e.json npx playwright test --reporter=json,line > /tmp/branch-e2e.log 2>&1); echo "exit $?"
          tail -n 5 /tmp/branch-e2e.log | while read -r l; do echo "::notice title=branch e2e tail::$l"; done; true
      - name: Main e2e
        shell: bash
        run: |
          set +e
          git checkout -q origin/main -- .
          npm ci --no-audit --no-fund >/dev/null && (cd frontend && npm ci --no-audit --no-fund >/dev/null)
          npm run build >/dev/null 2>&1; echo "build exit $?"
          (cd frontend && PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/main-e2e.json npx playwright test --reporter=json,line > /tmp/main-e2e.log 2>&1); echo "exit $?"
          tail -n 5 /tmp/main-e2e.log | while read -r l; do echo "::notice title=main e2e tail::$l"; done; true
      - name: Compare e2e
        shell: bash
        run: |
          cat > /tmp/fails.js <<'JS'
          const fs = require('fs')
          const out = new Set()
          let data
          try { data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')) } catch { console.log('__REPORT_MISSING__'); process.exit(0) }
          const walk = (suite, trail) => {
            for (const spec of suite.specs || []) for (const test of spec.tests || []) {
              const status = test.status || (test.results || []).map(r => r.status).pop()
              if (status === 'unexpected' || status === 'flaky') out.add(`${spec.file} > ${[...trail, spec.title].join(' > ')}`)
            }
            for (const child of suite.suites || []) walk(child, [...trail, child.title].filter(Boolean))
          }
          for (const suite of data.suites || []) walk(suite, [])
          for (const error of data.errors || []) console.error(`REPORT_ERROR ${String(error.message || '').split('\n')[0].slice(0, 200)}`)
          console.log([...out].sort().join('\n'))
          console.error(`expected=${data.stats?.expected} unexpected=${data.stats?.unexpected} flaky=${data.stats?.flaky} skipped=${data.stats?.skipped}`)
          JS
          node /tmp/fails.js /tmp/branch-e2e.json > /tmp/b.txt 2>/tmp/b.stats
          node /tmp/fails.js /tmp/main-e2e.json > /tmp/m.txt 2>/tmp/m.stats
          while read -r l; do echo "::notice title=e2e main::$l"; done < /tmp/m.stats
          while read -r l; do echo "::notice title=e2e branch::$l"; done < /tmp/b.stats
          sort -u /tmp/b.txt -o /tmp/b.txt; sort -u /tmp/m.txt -o /tmp/m.txt
          comm -13 /tmp/m.txt /tmp/b.txt | { grep -v '^$' || true; } > /tmp/new.txt
          while read -r line; do echo "::error title=NEW E2E FAILURE::$line"; done < /tmp/new.txt
          while read -r line; do echo "::notice title=e2e fails on main too::$line"; done < <(head -n 30 /tmp/m.txt)
          test ! -s /tmp/new.txt
