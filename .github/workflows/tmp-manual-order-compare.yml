name: TMP Manual Order Compare

# GEÇİCİ: birleştirmeden önce silinecek. Tüm backend testlerini main ve bu dal üzerinde koşar,
# yalnız bu dalda YENİ kırılan testleri hata olarak raporlar. Sır yok, deploy yok.
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-manual-order-compare.yml'
      - 'backend/**'
      - 'frontend/**'
      - '*.tsx'
      - '*.css'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA" main
          git -c advice.detachedHead=false checkout -q "$SHA"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" main:refs/remotes/origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Branch suite
        working-directory: backend
        shell: bash
        run: |
          set +e
          timeout 2700 python -m pytest $(ls tests/test_v25*.py tests/test_manual*.py tests/test_original*.py tests/test_trade*.py tests/test_live*.py tests/test_subscription.py tests/test_security*.py tests/test_master*.py tests/test_directional*.py tests/test_maintenance_mode.py 2>/dev/null) -q -p no:cacheprovider -rfE --tb=no -o addopts="" --continue-on-collection-errors \
            --ignore=tests/real_acceptance_validation.py 2>&1 | tail -n 400 > /tmp/branch.txt
          grep -E "^(FAILED|ERROR) " /tmp/branch.txt | sed -E 's/ - .*//' | sort -u > /tmp/branch_fail.txt
          tail -n 1 /tmp/branch.txt > /tmp/branch_summary.txt
          true
      - name: Main suite (same tests dir from main)
        shell: bash
        run: |
          set +e
          git worktree add -q /tmp/mainwt origin/main
          cd /tmp/mainwt/backend
          timeout 2700 python -m pytest $(ls tests/test_v25*.py tests/test_manual*.py tests/test_original*.py tests/test_trade*.py tests/test_live*.py tests/test_subscription.py tests/test_security*.py tests/test_master*.py tests/test_directional*.py tests/test_maintenance_mode.py 2>/dev/null) -q -p no:cacheprovider -rfE --tb=no -o addopts="" --continue-on-collection-errors \
            --ignore=tests/real_acceptance_validation.py 2>&1 | tail -n 400 > /tmp/main.txt
          grep -E "^(FAILED|ERROR) " /tmp/main.txt | sed -E 's/ - .*//' | sort -u > /tmp/main_fail.txt
          tail -n 1 /tmp/main.txt > /tmp/main_summary.txt
          true
      - name: Compare
        shell: bash
        run: |
          echo "::notice title=main summary::$(cat /tmp/main_summary.txt)"
          echo "::notice title=branch summary::$(cat /tmp/branch_summary.txt)"
          comm -13 /tmp/main_fail.txt /tmp/branch_fail.txt > /tmp/new_fail.txt
          comm -23 /tmp/main_fail.txt /tmp/branch_fail.txt > /tmp/fixed.txt
          echo "::notice title=counts::main_fail=$(wc -l < /tmp/main_fail.txt) branch_fail=$(wc -l < /tmp/branch_fail.txt) new=$(wc -l < /tmp/new_fail.txt) fixed=$(wc -l < /tmp/fixed.txt)"
          while read -r line; do echo "::error title=NEW FAILURE::$line"; done < /tmp/new_fail.txt
          while read -r line; do echo "::notice title=only on main::$line"; done < <(head -n 20 /tmp/fixed.txt)
          test ! -s /tmp/new_fail.txt

  e2e-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [branch, main]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Select variant
        if: matrix.variant == 'main'
        run: |
          git checkout -q origin/main -- .
          # Ana sürümde de aynı tırnak düzeltmesi (yoksa paket hiç açılmaz).
          sed -i "s/'Kais AI'a Sor'/\"Kais AI'a Sor\"/g" frontend/tests/chart-ai.spec.ts
      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          (cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          npm run build
      - name: Live trading e2e
        shell: bash
        run: |
          set +e
          cd frontend
          PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/e2e.json timeout 7800 npx playwright test \
            tests/live-trading-panel.spec.ts tests/master-trade-live-ui.spec.ts tests/master-trade-regressions.spec.ts \
            tests/master-trade-readonly.spec.ts tests/original-v2-live.spec.ts tests/master-trade-analysis-v2.spec.ts \
            tests/mobile-layout.spec.ts --reporter=json,line > /tmp/e2e.log 2>&1
          echo "exit $?"
          true
      - name: Report
        shell: bash
        run: |
          cat > /tmp/fails.js <<'JS'
          const fs = require('fs')
          let data
          try { data = JSON.parse(fs.readFileSync('/tmp/e2e.json', 'utf8')) } catch { console.log('STATS report missing'); process.exit(0) }
          const out = []
          const walk = (suite, trail) => {
            for (const spec of suite.specs || []) for (const test of spec.tests || []) {
              const status = test.status || (test.results || []).map(r => r.status).pop()
              if (status === 'unexpected' || status === 'flaky') out.push(`${spec.file} > ${[...trail, spec.title].join(' > ')}`)
            }
            for (const child of suite.suites || []) walk(child, [...trail, child.title].filter(Boolean))
          }
          for (const suite of data.suites || []) walk(suite, [])
          console.log(`STATS expected=${data.stats?.expected} unexpected=${data.stats?.unexpected} flaky=${data.stats?.flaky} skipped=${data.stats?.skipped}`)
          for (const error of data.errors || []) console.log(`ERR ${String(error.message || '').split('\n')[0].slice(0, 180)}`)
          for (const line of [...new Set(out)].sort()) console.log(`FAIL ${line.slice(0, 230)}`)
          JS
          node /tmp/fails.js > /tmp/report.txt
          # Ek açıklama sınırı (adım başına 10) yüzünden satırlar 25'erli tek mesajlarda birleştirilir.
          split -l 25 /tmp/report.txt /tmp/chunk_
          for f in /tmp/chunk_*; do echo "::warning title=${{ matrix.variant }}::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
