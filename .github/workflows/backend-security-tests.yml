name: Backend Security Tests

# Hesap silme ve kimlik/oturum güvenliği testleri. Zorunlu kapı: başarısız VEYA atlanan test işi kırar.
# - Hata gizleme (shell'de "veya true" kalıbı) yok; pytest başarısızsa adım kırmızı olur.
# - Bilinen-hata listesi yok; atlanan/xfail test başarı sayılmaz (.github/scripts/security_test_gate.py).
# - xfail_strict=true: beklenmedik geçen (XPASS) test başarısız sayılır; non-strict XPASS JUnit'te sıradan geçiş gibi görünür.
# - `pytest --collect-only` çıktısı yetkili test listesidir; kapı, listedeki her düğüm kimliğini pytest'in JUnit
#   (classname, name) kuralıyla dönüştürüp raporla birebir karşılaştırır. Modül başına en az test sayısı
#   (`--min-tests`) gerçek bir yeşil koşunun sayısından alınmıştır; düşüşü kırmızı yapar. JUnit `file` niteliği
#   kullanılmaz: başka modülden miras alınan testlerde tanımlandığı dosyayı gösterir. Toplama ve koşu aynı dizinden
#   (backend) yapılır; junit_family açıkça xunit2.
# - Gerçek PostgreSQL gerekmez: bu iki dosya DSN okumaz ve veritabanı bağlantısı açmaz (testler sahte/yerel depo kullanır).
#   Gerçek PG migration/trigger testleri sonraki aşamadadır.
# - Salt okunur: sır yok, deploy yok, migration yok.
# - paths filtresi bilerek yok: bu iş "required check" yapılırsa backend dışı PR'larda askıda kalmasın.
# - Kapı adımı `!cancelled()` ile çalışır: başarı ve başarısızlıkta çalışır, iptalde çalışmaz (iptalde rapor eksik/kısmi olur
#   ve gürültü üretir; iptal edilen koşu zaten başarılı sayılmaz).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout depodaki bozuk 'tradbt458-main' alt modül girdisi (.gitmodules yok) yüzünden çöküyor;
      # alt modüllere dokunmayan düz git fetch kullanılır (backend-assistant-tests.yml ile aynı). Jeton diske yazılmaz.
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Collect tests (authoritative list for the gate)
        working-directory: backend
        run: |
          if ! python -m pytest --collect-only -q -p no:cacheprovider -o xfail_strict=true \
              tests/test_account_settings.py tests/test_security_auth_hardening.py > security-collected.txt; then
            cat security-collected.txt
            exit 1
          fi
          tail -n 3 security-collected.txt
      # Kayıt amaçlı: toplanan test kimlikleri iş özetine ve bir bildirime yazılır (pass/fail'i etkilemez; kaynak: toplama listesi).
      - name: Record collected test ids (job summary + annotation)
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          test -f security-collected.txt || exit 0
          awk '/^[^ :]+\.py::/ { n++ } END { print n+0 " test ids collected" }' security-collected.txt
          {
            echo '### Collected security test ids'
            echo '```'
            awk '/^[^ :]+\.py::/' security-collected.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          IDS=$(awk 'BEGIN { ORS = "" } /^[^ :]+\.py::/ { gsub(/%/, "%25"); print $0 "%0A" }' security-collected.txt)
          echo "::notice title=collected security test ids::${IDS}"
      - name: pytest (account deletion + auth hardening)
        working-directory: backend
        run: >
          python -m pytest
          tests/test_account_settings.py
          tests/test_security_auth_hardening.py
          -q -rfEsxX --tb=short -p no:cacheprovider
          -o junit_family=xunit2 -o xfail_strict=true
          --junitxml=security-report.xml
      # Taban (--min-tests): PR #103'ün ilk gerçek koşusundan (run 39394558044, main@10ba250 paketi): 23 ve 74 çalıştırılan test.
      # Düşürmek kod incelemesi gerektirir; test eklenince ARTIRILMALIDIR (ör. hesap silme testleri birleşince 23 -> daha yüksek).
      - name: Gate (any failure, error, skip, missing/corrupt report, unexecuted test or count below minimum fails)
        if: ${{ !cancelled() }}
        run: >
          python .github/scripts/security_test_gate.py
          --report backend/security-report.xml
          --collected backend/security-collected.txt
          --require tests/test_account_settings.py
          --require tests/test_security_auth_hardening.py
          --min-tests tests/test_account_settings.py=23
          --min-tests tests/test_security_auth_hardening.py=74
