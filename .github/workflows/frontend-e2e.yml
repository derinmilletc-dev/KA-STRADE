name: Frontend Live Trading UI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-e2e.yml'

permissions:
  contents: read

# Aynı dalda yeni commit gelince eski koşu iptal edilir; asılı kalan test sınırsız yer tutmasın
# (daha önce 20 koşu saatlerce asılı kalıp zorunlu security-tests'i sıraya hapsetti).
concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-trading-ui:
    runs-on: ubuntu-latest
    # 41 test dosyası tek sırayla çalışınca 20 dakikalık süreye sığmıyor ve her koşu iptal oluyordu (hiçbir dalda yeşil olmadı).
    # Paket 6 parçaya bölünür; her parça kendi koşucusunda paralel çalışır ve bir parçanın hatası diğerlerini durdurmaz.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm --prefix .. ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix .. run build
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/6