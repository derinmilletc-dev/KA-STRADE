name: Tmp backend per file (temporary, delete before merge)
on:
  push:
    branches: [chore/testler-ci]
permissions:
  contents: read
jobs:
  tmp-backend-files:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: each test file with a time limit
        working-directory: backend
        shell: bash
        run: |
          set +e
          i=0; ok=""; slow=""; bad=""
          for f in $(ls tests/test_*.py | grep -v '_pg.py' | sort); do
            if [ $((i % 6)) -eq ${{ matrix.shard }} ]; then
              s=$(date +%s)
              timeout 100 python -m pytest "$f" -q -p no:cacheprovider --tb=line -x > /tmp/o.txt 2>&1
              code=$?
              e=$(( $(date +%s) - s ))
              if [ $code -eq 0 ]; then ok="$ok $f:${e}s"
              elif [ $code -eq 124 ]; then slow="$slow $f"
              else bad="$bad $f($(grep -E '^(FAILED|ERROR)' /tmp/o.txt | head -1 | cut -c1-120))"; fi
            fi
            i=$((i+1))
          done
          echo "::warning::OK$ok"
          echo "::warning::SLOW$slow"
          echo "::warning::BAD$bad"
