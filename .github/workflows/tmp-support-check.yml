name: Tmp support check (temporary, delete before merge)
on:
  push:
    branches: [feat/destek-ekip-bildirimi]
permissions:
  contents: read
jobs:
  tmp-support-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest (PR) + pytest (main)
        working-directory: backend
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          T="tests/test_moderator_support.py tests/test_support_sync.py tests/test_support_attachments.py tests/test_route_policy_inventory.py tests/test_moderator_access.py tests/test_moderator_role.py tests/test_binance_notifications.py tests/test_v21_auto_trade_bot.py tests/test_v22_commercial.py tests/test_account_settings.py tests/test_security_auth_hardening.py tests/test_email_service.py"
          T2=""; for f in $T; do test -f "$f" && T2="$T2 $f"; done
          python -m pytest $T2 -q -rfE --tb=short -p no:cacheprovider > /tmp/pr.txt 2>&1
          grep -E "^(FAILED|ERROR)" /tmp/pr.txt | head -15 | while read -r l; do echo "::error::PRFAIL ${l:0:700}"; done
          grep -B2 -A12 "^_____.*test_\(take_reply\|reply_without\|failed_audit_does\|customer_sees\|bell_lists\|reply_email\|moderator_sees\)" /tmp/pr.txt | head -80 | tr '\n' ' ' | fold -w 900 | head -8 | while read -r l; do echo "::warning::TRACE $l"; done
          cd .. && git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" fetch -q --depth=1 "https://github.com/$REPO" main && git checkout -q FETCH_HEAD && cd backend
          T3=""; for f in $T; do test -f "$f" && T3="$T3 $f"; done
          python -m pytest $T3 -q -rfE --tb=line -p no:cacheprovider > /tmp/main.txt 2>&1
          grep -E "^(FAILED|ERROR)" /tmp/pr.txt | sed 's/ - .*//' | sort > /tmp/prf.txt; grep -E "^(FAILED|ERROR)" /tmp/main.txt | sed 's/ - .*//' | sort > /tmp/mainf.txt
          echo "::warning::PR summary: $(tail -1 /tmp/pr.txt)"
          echo "::warning::MAIN summary: $(tail -1 /tmp/main.txt)"
          comm -23 /tmp/prf.txt /tmp/mainf.txt | head -20 | while read -r l; do echo "::error::NEW $l"; done
          comm -12 /tmp/prf.txt /tmp/mainf.txt | head -10 | while read -r l; do echo "::notice::BOTH $l"; done
          test -z "$(comm -23 /tmp/prf.txt /tmp/mainf.txt)"
