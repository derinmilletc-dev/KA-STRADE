name: Tmp node tests (temporary, delete before merge)
on:
  push:
    branches: [chore/testler-ci]
permissions:
  contents: read
jobs:
  tmp-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: every node test file
        shell: bash
        run: |
          set +e
          ok=""; bad=""
          for f in tools/*.test.mjs frontend/src/*.test.mts frontend/src/*.test.ts *.test.mts; do
            test -f "$f" || continue
            timeout 300 node --test "$f" > /tmp/out.txt 2>&1
            if [ $? -eq 0 ]; then ok="$ok $f"; else bad="$bad $f"; echo "::warning::DETAIL $f $(grep -E 'Error|not ok' /tmp/out.txt | head -3 | tr '\n' ' ' | cut -c1-300)"; fi
          done
          echo "::warning::OK $ok"
          echo "::warning::BAD $bad"
