name: TMP Original Regression
on:
  pull_request:
    paths:
      - '.github/workflows/tmp-original-regression.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR and main (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          H="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          mkdir pr main
          for d in pr main; do git -C $d init -q; done
          git -C pr -c http.extraheader="$H" fetch -q --depth=1 "https://github.com/$REPO" "${{ github.event.pull_request.head.sha }}"
          git -C pr -c advice.detachedHead=false checkout -q FETCH_HEAD
          git -C main -c http.extraheader="$H" fetch -q --depth=1 "https://github.com/$REPO" "${{ github.event.pull_request.base.sha }}"
          git -C main -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -r pr/backend/requirements-dev.txt
      - name: Run both
        shell: bash
        run: |
          set +e
          T="tests/test_original_*.py tests/test_prescreen_original_v2.py tests/test_strategy_original_adapter.py"
          (cd pr/backend && python -m pytest $T -q -rfE --tb=line -p no:cacheprovider > ../../pr.txt 2>&1)
          (cd main/backend && python -m pytest $T -q -rfE --tb=line -p no:cacheprovider > ../../main.txt 2>&1)
          grep -E "^(FAILED|ERROR)" pr.txt | sed 's/ - .*//' | sort -u > pr.f
          grep -E "^(FAILED|ERROR)" main.txt | sed 's/ - .*//' | sort -u > main.f
          echo "::notice::main failures: $(wc -l < main.f); PR failures: $(wc -l < pr.f)"
          tail -1 pr.txt | sed 's/^/::notice::PR: /'; tail -1 main.txt | sed 's/^/::notice::MAIN: /'
          for f in main pr; do echo "::notice::$f by file: $(sed 's/::.*//' $f.f | sort | uniq -c | sort -rn | head -8 | tr '\n' ';')"; done
          grep -E "^FAILED tests/test_original_v2_live.py" main.txt | sed 's/.* - //' | cut -c1-150 | sort | uniq -c | sort -rn | head -6 | while read l; do echo "::notice::REASON $l"; done
          comm -13 main.f pr.f | head -9 | while read l; do echo "::error::NEW FAIL $l"; done
          exit 0
