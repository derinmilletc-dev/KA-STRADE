name: Tmp e2e per file (temporary, delete before merge)
on:
  push:
    branches: [chore/testler-ci]
permissions:
  contents: read
jobs:
  tmp-e2e-files:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm --prefix .. ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix .. run build
      - name: each spec file with a time limit
        shell: bash
        run: |
          set +e
          i=0; res=""
          for f in $(ls tests/*.spec.ts | sort); do
            if [ $((i % 6)) -eq ${{ matrix.shard }} ]; then
              s=$(date +%s)
              timeout 240 npx playwright test "$f" --reporter=line > /tmp/o.txt 2>&1
              code=$?
              e=$(( $(date +%s) - s ))
              tail1=$(grep -E "passed|failed|skipped" /tmp/o.txt | tail -2 | tr '\n' ' ')
              res="$res\n$f code=$code ${e}s $tail1"
            fi
            i=$((i+1))
          done
          echo "::warning::RESULT $(printf "$res" | tr '\n' '|' | cut -c1-3800)"
