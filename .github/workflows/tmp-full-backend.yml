name: Tmp full backend run (temporary, delete before merge)
on:
  push:
    branches: [chore/testler-ci]
permissions:
  contents: read
jobs:
  tmp-full:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: full pytest (no pg tests)
        working-directory: backend
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          timeout 2400 python -m pytest tests -q -rfE --tb=line -p no:cacheprovider --ignore-glob='tests/*_pg.py' --durations=15 > /tmp/full.txt 2>&1
          echo "exit=$? seconds=$(( $(date +%s) - start ))"
          echo "::warning::SUMMARY $(tail -1 /tmp/full.txt)"
          grep -E "^(FAILED|ERROR)" /tmp/full.txt | sed 's/ - .*//' | sort > /tmp/f.txt
          echo "::warning::FAILCOUNT $(wc -l < /tmp/f.txt)"
          split -l 25 /tmp/f.txt /tmp/chunk_
          for c in /tmp/chunk_*; do echo "::warning::FAILS $(tr '\n' ' ' < $c)"; done
          grep -A16 "slowest" /tmp/full.txt | head -18 | tr '\n' ' ' | sed 's/^/::warning::SLOW /'
