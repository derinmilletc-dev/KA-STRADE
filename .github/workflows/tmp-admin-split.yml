name: Tmp admin split check (temporary, delete after run)

on:
  push:
    branches: ['feat/admin-surface-split']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (submodules skipped)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth=1 "https://github.com/$REPO" "$SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: npm ci
        run: npm ci --no-audit --no-fund 2>&1 | tail -5
      - name: Typecheck (build gate)
        id: tsc_build
        run: (node node_modules/typescript/bin/tsc -b && node node_modules/typescript/bin/tsc --noEmit -p tsconfig.access.json) > tsc-build.log 2>&1; echo "rc=$?" >> tsc-build.log; tail -30 tsc-build.log
      - name: Typecheck changed admin files (informational, not a build gate)
        run: |
          cat > tsconfig.tmp-admin.json <<'JSON'
          {"extends":"./tsconfig.json","compilerOptions":{"types":["vite/client","node"],"noEmit":true},
           "include":["AuthGate.tsx","account-surface.ts","admin-main.tsx","AdminPanel.tsx","ModeratorPanel.tsx","AdminApprovals.tsx","AdminPremiumRequests.tsx","ModeratorPremiumRequests.tsx","premium-requests-model.ts","vite-env.d.ts"]}
          JSON
          node node_modules/typescript/bin/tsc -p tsconfig.tmp-admin.json > tsc-admin.log 2>&1; echo "rc=$?" >> tsc-admin.log; tail -60 tsc-admin.log
      - name: Vite build with admin origin set
        env:
          VITE_ADMIN_ORIGIN: https://admin.kaistrade.com
        run: node node_modules/vite/bin/vite.js build > vite.log 2>&1; echo "rc=$?" >> vite.log; tail -25 vite.log; ls dist | head -20; ls dist/assets | grep -i "admin\|Moderator" | head
      - name: Bundle separation facts
        run: |
          {
            echo "== admin.html scripts"; grep -o 'src="[^"]*"' dist/admin.html
            echo "== index.html scripts"; grep -o 'src="[^"]*"' dist/index.html
            echo "== files containing customer app marker v26Brand"; grep -l "v26Brand" dist/assets/*.js || true
            echo "== files containing adminShell (AdminPanel)"; grep -l "adminShell" dist/assets/*.js || true
            echo "== files containing Premium taleplerim (moderator)"; grep -l "Premium taleplerim" dist/assets/*.js || true
            echo "== files containing admin.kaistrade.com"; grep -l "admin.kaistrade.com" dist/assets/*.js || true
            echo "== files containing CONTROL CENTER but also v26Brand (should be none)"; for f in $(grep -l "adminShell" dist/assets/*.js); do grep -l "v26Brand" $f || true; done
            echo "== sizes"; ls -la dist/assets | grep -i "^.* main-\|admin" | awk '{print $5, $9}'
          } > facts.log 2>&1; cat facts.log
      - name: Behaviour check of account-surface helpers
        run: |
          node node_modules/esbuild/bin/esbuild account-surface.ts --format=esm --outfile=/tmp/surface.mjs \
            --define:import.meta.env.VITE_ADMIN_ORIGIN='"https://admin.kaistrade.com"' --define:import.meta.env.VITE_CUSTOMER_ORIGIN='""' > surface-build.log 2>&1
          cat > /tmp/check.mjs <<'JS'
          let replaced = null
          globalThis.window = {location: {origin: 'https://kaistrade.com', replace: u => { replaced = u }}}
          const m = await import('/tmp/surface.mjs')
          const out = []
          const eq = (name, got, want) => out.push((JSON.stringify(got) === JSON.stringify(want) ? 'PASS ' : 'FAIL ') + name + ' got=' + JSON.stringify(got))
          eq('ADMIN_ORIGIN', m.ADMIN_ORIGIN, 'https://admin.kaistrade.com')
          eq('CUSTOMER_ORIGIN fallback', m.CUSTOMER_ORIGIN, 'https://kaistrade.com')
          eq('staffUrl customer->admin', m.staffUrl('/admin'), 'https://admin.kaistrade.com/admin')
          eq('staffUrl already on admin', m.staffUrl('/admin', 'https://admin.kaistrade.com'), '/admin')
          eq('redirect started', m.redirectStaffPathToAdminOrigin('/moderator'), true)
          eq('redirect target', replaced, 'https://admin.kaistrade.com/moderator')
          eq('no redirect on admin origin', m.redirectStaffPathToAdminOrigin('/admin', 'https://admin.kaistrade.com'), false)
          eq('OWNER /dashboard -> /admin', m.staffSurfacePath('OWNER', '/dashboard'), '/admin')
          eq('OWNER / -> /admin', m.staffSurfacePath('OWNER', '/'), '/admin')
          eq('OWNER /admin/x stays', m.staffSurfacePath('OWNER', '/admin/x'), '/admin/x')
          eq('OWNER /settings stays', m.staffSurfacePath('OWNER', '/settings'), '/settings')
          eq('MODERATOR /admin -> /moderator', m.staffSurfacePath('MODERATOR', '/admin'), '/moderator')
          eq('MODERATOR /dashboard -> /moderator', m.staffSurfacePath('MODERATOR', '/dashboard'), '/moderator')
          eq('MODERATOR /settings stays (MFA enrolment)', m.staffSurfacePath('MODERATOR', '/settings'), '/settings')
          eq('MODERATOR /administrator -> /moderator', m.staffSurfacePath('MODERATOR', '/administrator'), '/moderator')
          console.log(out.join('\n'))
          JS
          node /tmp/check.mjs > surface-check.log 2>&1; cat surface-build.log surface-check.log
          # unset origin => no redirect at all
          node node_modules/esbuild/bin/esbuild account-surface.ts --format=esm --outfile=/tmp/surface-off.mjs --define:import.meta.env.VITE_ADMIN_ORIGIN='""' --define:import.meta.env.VITE_CUSTOMER_ORIGIN='""' >/dev/null 2>&1
          cat > /tmp/check-off.mjs <<'JS'
          globalThis.window = {location: {origin: 'https://kaistrade.com', replace: () => { throw new Error('must not redirect') }}}
          const m = await import('/tmp/surface-off.mjs')
          console.log((m.ADMIN_ORIGIN === '' && m.staffUrl('/admin') === '/admin' && m.redirectStaffPathToAdminOrigin('/admin') === false ? 'PASS' : 'FAIL') + ' unset origin keeps today behaviour')
          JS
          node /tmp/check-off.mjs >> surface-check.log 2>&1; tail -3 surface-check.log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/test_admin_origin.py tests/test_web_security.py tests/test_moderator_access.py tests/test_moderator_role.py tests/test_route_policy_inventory.py -q -rfE --tb=short -p no:cacheprovider --junitxml=scope-report.xml > pytest.log 2>&1; echo "rc=$?" >> pytest.log; tail -25 pytest.log
      - name: Report as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import os
          def esc(s): return s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          def tail(path, n):
              try: return ''.join(open(path, errors='replace').readlines()[-n:])
              except OSError: return '(missing)'
          for title, path, n in [('TSC BUILD GATE','tsc-build.log',40),('TSC ADMIN FILES','tsc-admin.log',80),('VITE BUILD','vite.log',40),('PYTEST','backend/pytest.log',40),('BUNDLE FACTS','facts.log',60),('SURFACE CHECK','surface-check.log',40)]:
              print('::notice title=' + title + '::' + esc(tail(path, n)))
          PY
